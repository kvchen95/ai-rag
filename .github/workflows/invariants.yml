name: invariants

on:
  pull_request:
    paths:
      - "**/*.py"
      - "ruff.toml"
      - "scripts/check_invariants.py"
      - "scripts/check_source_language.py"
      - "architecture/invariants.yaml"
      - "docs/engineering/ENGINEERING_CONSTITUTION.md"

jobs:
  failure-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check invariants (full repository)
        run: python scripts/check_invariants.py --all
      - name: Check Chinese literals (full repository)
        run: python scripts/check_source_language.py --all
      - name: Install Ruff
        run: python -m pip install "ruff==0.8.6"
      - name: Check Google Style (full repository)
        run: ruff check . --config ruff.toml
