server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 'ok';
    }

    # Convenience: same-origin API health for dev checks
    location = /api/healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    # Same-origin API passthrough: the frontend can call /api/v1/... without CORS.
    # The /api prefix is preserved; api serves /api/v1/... per 详细设计.md 附录 C.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
