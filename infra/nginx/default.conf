server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS。nginx 只在启动时解析一次 proxy_pass 里的主机名，api 容器一重建
    # （每次 make up --build 都会）IP 就变，不写 resolver 会稳定复现 "api 健康但 /api 502"。
    # valid=10s：新 IP 最多 10 秒生效。配合下面的变量写法，运行时才解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 'ok';
    }

    # Convenience: same-origin API health for dev checks
    location = /api/healthz {
        set $api_health http://api:8000/healthz;
        proxy_pass $api_health;
        proxy_set_header Host $host;
    }

    # Same-origin API passthrough: the frontend can call /api/v1/... without CORS.
    # The /api prefix is preserved; api serves /api/v1/... per 详细设计.md 附录 C.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
