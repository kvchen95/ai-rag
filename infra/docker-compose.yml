name: ai-rag

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + pgvector extension (needed by chunks.embedding_dense vector(512)).
    # Plain postgres:16-alpine has no vector extension, so `CREATE EXTENSION vector` fails there.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: ai-rag-postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB:-ai_rag}
      POSTGRES_USER: ${POSTGRES_USER:-ai_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_rag_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: ai-rag-qdrant
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # All-in-docker CPU model services (default): Hugging Face TEI (text-embeddings-inference).
  # Same image, two roles. Weights are cached in the model_cache volume (/data), so a
  # restart does not re-download. First start downloads weights (~100MB / ~1.1GB).
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: ai-rag-embedding
    restart: unless-stopped
    environment:
      <<: *common-env
      HF_HOME: /data
      # Optional HF mirror, e.g. https://hf-mirror.com (leave empty for default endpoint)
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    command: >
      --model-id ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      --port 8000
      --max-client-batch-size 32
      --auto-truncate
    ports:
      - "${EMBEDDING_PORT:-7997}:8000"
    volumes:
      - model_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: ai-rag-rerank
    restart: unless-stopped
    environment:
      <<: *common-env
      HF_HOME: /data
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    command: >
      --model-id ${RERANK_MODEL:-BAAI/bge-reranker-base}
      --port 8000
      --max-client-batch-size 32
      --auto-truncate
    ports:
      - "${RERANK_PORT:-7999}:8000"
    volumes:
      - model_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 420s

  api:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    container_name: ai-rag-api
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_rag}:${POSTGRES_PASSWORD:-ai_rag_dev_password}@postgres:5432/${POSTGRES_DB:-ai_rag}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kb_chunks}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-512}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://rerank:8000}
      RERANK_API_KEY: ${RERANK_API_KEY:-local}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-base}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL: ${VLM_MODEL:-}
      GATE_REJECT_NONE: ${GATE_REJECT_NONE:-0.20}
      GATE_REJECT_LOW: ${GATE_REJECT_LOW:-0.40}
      MAX_HOPS: ${MAX_HOPS:-3}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-30}
      RERANK_TOP_N_MIN: ${RERANK_TOP_N_MIN:-5}
      RERANK_TOP_N_MAX: ${RERANK_TOP_N_MAX:-8}
      EVIDENCE_MAX_CHARS: ${EVIDENCE_MAX_CHARS:-6000}
      # API 运行时参数（业务阈值/模型名在上面，必须有值；这些有代码默认值）
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      DB_CONNECT_TIMEOUT_S: ${DB_CONNECT_TIMEOUT_S:-3}
      QDRANT_TIMEOUT_S: ${QDRANT_TIMEOUT_S:-5}
      EMBEDDING_TIMEOUT_S: ${EMBEDDING_TIMEOUT_S:-10}
      RERANK_TIMEOUT_S: ${RERANK_TIMEOUT_S:-10}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-30}
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-1500}
      QA_BUDGET_S: ${QA_BUDGET_S:-30}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-500}
      QA_MAX_CONCURRENCY: ${QA_MAX_CONCURRENCY:-8}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      # 摄取（A1）：样本目录与重试上限。目录是相对 repo 根的路径（compose 把 ../ 挂到 /app）。
      INGEST_SAMPLES_DIR: ${INGEST_SAMPLES_DIR:-samples}
      INGEST_MAX_RETRIES: ${INGEST_MAX_RETRIES:-3}
      # 向量同步 / 回收（A3，§4.2 / §4.3）
      VECTOR_SYNC_MAX_ATTEMPTS: ${VECTOR_SYNC_MAX_ATTEMPTS:-4}
      VECTOR_SYNC_BACKOFF_S: ${VECTOR_SYNC_BACKOFF_S:-1.0}
      VECTOR_SYNC_INTERVAL_S: ${VECTOR_SYNC_INTERVAL_S:-10}
      VECTOR_SYNC_RECONCILE_EVERY: ${VECTOR_SYNC_RECONCILE_EVERY:-10}
      VECTOR_RETENTION_HOURS: ${VECTOR_RETENTION_HOURS:-24}
      FIGURES_DIR: ${FIGURES_DIR:-figures}
      AUTH_MODE: ${AUTH_MODE:-fixed_jwt}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-change-me}
      AUTH_JWT_ALG: ${AUTH_JWT_ALG:-HS256}
      AUTH_JWT_USER_ID_CLAIM: ${AUTH_JWT_USER_ID_CLAIM:-sub}
      AUTH_JWT_DEPTS_CLAIM: ${AUTH_JWT_DEPTS_CLAIM:-user_depts}
      AUTH_JWT_ROLES_CLAIM: ${AUTH_JWT_ROLES_CLAIM:-user_roles}
      AUTH_JWT_ADMIN_CLAIM: ${AUTH_JWT_ADMIN_CLAIM:-admin}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../:/app
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: infra/worker/Dockerfile
    container_name: ai-rag-worker
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_rag}:${POSTGRES_PASSWORD:-ai_rag_dev_password}@postgres:5432/${POSTGRES_DB:-ai_rag}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kb_chunks}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-512}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://rerank:8000}
      RERANK_API_KEY: ${RERANK_API_KEY:-local}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-base}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL: ${VLM_MODEL:-}
      # 向量同步（A3，§4.2）：轮询间隔与对账节奏。口径全部来自环境变量，
      # 不在 worker 里另写一份默认值（配置只有一个来源：api/config.py）。
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-ai-rag-api}
      DB_CONNECT_TIMEOUT_S: ${DB_CONNECT_TIMEOUT_S:-3}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      QDRANT_TIMEOUT_S: ${QDRANT_TIMEOUT_S:-5}
      EMBEDDING_TIMEOUT_S: ${EMBEDDING_TIMEOUT_S:-10}
      VECTOR_SYNC_MAX_ATTEMPTS: ${VECTOR_SYNC_MAX_ATTEMPTS:-4}
      VECTOR_SYNC_BACKOFF_S: ${VECTOR_SYNC_BACKOFF_S:-1.0}
      VECTOR_SYNC_INTERVAL_S: ${VECTOR_SYNC_INTERVAL_S:-10}
      VECTOR_SYNC_RECONCILE_EVERY: ${VECTOR_SYNC_RECONCILE_EVERY:-10}
      VECTOR_RETENTION_HOURS: ${VECTOR_RETENTION_HOURS:-24}
      FIGURES_DIR: ${FIGURES_DIR:-figures}
    volumes:
      - ../:/app
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker.ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    container_name: ai-rag-web
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "${WEB_PORT:-5173}:80"
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pg_data:
    name: ai_rag_pg_data
  qdrant_data:
    name: ai_rag_qdrant_data
  app_data:
    name: ai_rag_app_data
  model_cache:
    name: ai_rag_model_cache
