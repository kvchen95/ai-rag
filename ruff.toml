target-version = "py312"
# Google Python Style Guide: 80 columns.
line-length = 80

[lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "D",    # pydocstyle
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RET",  # return
  "BLE",  # blind except
  "S110", # try-except-pass
  "TID",  # banned imports
]
ignore = ["E203", "E266"]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["api"]

[lint.per-file-ignores]
# Prompt/resource files intentionally hold long prose.
"api/prompts/**" = ["E501"]
"api/resources/**" = ["E501"]
# Test and tooling modules are not public library APIs.
"api/tests/**" = ["D100", "D101", "D102", "D103", "D107", "D415"]
"scripts/**" = ["D100", "D101", "D102", "D103", "D107"]

[lint.flake8-tidy-imports.banned-api]
"api.llm_json".msg = "deterministic modules must not import the generation model"
