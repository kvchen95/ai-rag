repos:
  - repo: local
    hooks:
      - id: python-source-language
        name: python source language
        entry: python3 scripts/check_source_language.py --files
        language: system
        types: [python]
      - id: ruff-google
        name: ruff google style (full repository)
        entry: uv run --offline --with ruff==0.8.6 ruff check . --config ruff.toml
        language: system
        types: [python]
        pass_filenames: false
